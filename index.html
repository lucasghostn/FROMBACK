<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>FROMBACK</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <h1>FROMBACK</h1>

    <!-- TELA INICIAL -->
    <div id="home">
      <button onclick="showSend()">Enviar</button>
      <button onclick="showReceive()">Receber</button>
    </div>

    <!-- ENVIAR -->
    <div id="send" class="hidden">
      <h2>Enviar arquivo</h2>

      <input id="fromName" placeholder="Seu nome (ex: João)">
      <input id="toName" placeholder="Para quem (ex: Maria)">
      <input type="file" id="fileInput">

      <button onclick="sendFile()">Enviar</button>
      <button onclick="backHome()">Voltar</button>
    </div>

    <!-- RECEBER -->
    <div id="receive" class="hidden">
      <h2>Receber arquivos</h2>

      <input id="receiveName" placeholder="Seu nome">
      <button onclick="loadFiles()">Ver arquivos</button>

      <div id="files"></div>

      <button onclick="backHome()">Voltar</button>
    </div>

  </div>

  <!-- FIREBASE (compatível com GitHub Pages) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <!-- JS DO APP -->
  <script src="app.js"></script>

</body>
</html>
